spring:
  application:
    name: fxhedgedesk
  datasource:
    url: ${DB_URL:jdbc:h2:mem:fxhedgedesk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

fxhedgedesk:
  jwt:
    secret: ${JWT_SECRET:fxhedgedesk-dev-secret-change-me-fxhedgedesk-dev-secret-change-me}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:120}
  simulation:
    tick-interval-ms: ${SIM_TICK_MS:4000}
    days-per-tick: ${SIM_DAYS_PER_TICK:1}
